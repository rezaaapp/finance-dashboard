services:
  - type: web
    name: finance-dashboard-api
    env: docker
    rootDir: backend
    envVars:
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_AUTH_TOKEN
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://finance-dashboard-mu-lac.vercel.app,http://localhost:5173,http://127.0.0.1:5173
